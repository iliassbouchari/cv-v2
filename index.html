var n=Math.round(W/46);N=[];for(var i=0;i<n;i++)N.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,sh:i%7==0});P=[];cs();if(rm)draw()}
function link(a,b){var dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy<(W<560?90*90:120*120)}
function draw(){x.clearRect(0,0,W,H);x.lineWidth=1;
for(var i=0;i<N.length;i++)for(var j=i+1;j<N.length;j++)if(link(N[i],N[j])){x.globalAlpha=.35;x.strokeStyle=col.m;x.beginPath();x.moveTo(N[i].x,N[i].y);x.lineTo(N[j].x,N[j].y);x.stroke()}
for(var k=0;k<P.length;k++){var p=P[k],a=N[p.a],b=N[p.b];if(!a||!b)continue;var px=a.x+(b.x-a.x)*p.t,py=a.y+(b.y-a.y)*p.t;x.globalAlpha=1;x.fillStyle=col.a;x.shadowColor=col.a;x.shadowBlur=8;x.fillRect(px-2,py-2,4,4);x.shadowBlur=0}
for(i=0;i<N.length;i++){var n=N[i];x.globalAlpha=.9;x.strokeStyle=n.sh?col.a:col.m;x.fillStyle=n.sh?col.a:col.m;
if(n.sh){x.beginPath();x.moveTo(n.x,n.y-6);x.lineTo(n.x+5,n.y-3.5);x.lineTo(n.x+5,n.y+1.5);x.lineTo(n.x,n.y+6);x.lineTo(n.x-5,n.y+1.5);x.lineTo(n.x-5,n.y-3.5);x.closePath();x.globalAlpha=.25;x.fill();x.globalAlpha=1;x.stroke()}
else{x.beginPath();x.arc(n.x,n.y,2.4,0,6.3);x.fill()}}x.globalAlpha=1}
function step(){fr++;for(var i=0;i<N.length;i++){var n=N[i];n.x+=n.vx;n.y+=n.vy;if(n.x<0||n.x>W)n.vx*=-1;if(n.y<0||n.y>H)n.vy*=-1}
if(fr%28==0&&P.length<5){var a=Math.floor(Math.random()*N.length),best=-1;for(var j=0;j<N.length;j++)if(j!=a&&link(N[a],N[j])){best=j;if(Math.random()<.4)break}if(best>=0)P.push({a:a,b:best,t:0,s:.012+Math.random()*.012})}
for(var k=P.length-1;k>=0;k--){P[k].t+=P[k].s;if(P[k].t>=1)P.splice(k,1)}
if(fr%60==0)cs()}
function loop(){if(run&&vis){step();draw()}requestAnimationFrame(loop)}
var L=["$ whoami","iliass: systems, networks, security","$ nmap -sV --top-ports 20 lab.local","22/tcp open ssh  OpenSSH 9.x","443/tcp open https  hardened","$ status","all checks passed"],ci=0,cj=0,out=[];
function type(){if(rm){t.innerHTML="<b>$</b> whoami\niliass: systems, networks, security\n<b>$</b> status: all checks passed";return}
var l=L[ci];if(cj<=l.length){var cur=out.concat([l.slice(0,cj)]);t.innerHTML=cur.map(function(z){return z.charAt(0)=="$"?"<b>$</b>"+z.slice(1):z}).join("\n")+"<i></i>";cj++;setTimeout(type,l.charAt(0)=="$"?55:18)}
else{out.push(l);if(out.length>2)out.shift();ci++;cj=0;if(ci>=L.length){ci=0;setTimeout(function(){out=[];type()},2500)}else setTimeout(type,l.charAt(0)=="$"?350:900)}}
addEventListener("resize",size);document.addEventListener("visibilitychange",function(){run=!document.hidden});
if("IntersectionObserver" in window)new IntersectionObserver(function(e){vis=e[0].isIntersecting}).observe(bar);
document.getElementById("theme").addEventListener("click",function(){setTimeout(function(){cs();if(rm)draw()},50)});
size();type();if(!rm)loop()})();
</script>
</body></html>
